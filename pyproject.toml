[project]
name = "orders-text-to-sql"
version = "0.1.0"
description = "Natural-language questions over an orders dataset, translated to validated read-only SQL."
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
